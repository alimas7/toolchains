name: "Build"

on: workflow_dispatch

jobs:
  toolchain:
    name: 'kindle3-toolchain'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install packages
      run: sudo apt-get update -qq &&
           sudo apt-get install --no-install-recommends -y
               autoconf autoconf2.64 autoconf2.69 autogen automake automake1.11
               bison build-essential cvs flex gcc-multilib git gperf help2man
               lhasa libfl-dev libtool pristine-tar subversion texinfo unzip
               libssl-dev pkg-config python3 gawk wget xz-utils make

    - name: Create output dir
      run: mkdir -p /opt/netsurf

    - name: Build modern Kindle 3 toolchain (ARM1136)
      env:
        TOOLCHAIN_NAME: "arm-none-linux-gnueabi"
        GCCSDK_INSTALL_ROOT: /opt/netsurf/${TOOLCHAIN_NAME}
        TARGET: arm-none-linux-gnueabi
        CFLAGS_FOR_TARGET: "-march=armv6 -mtune=arm1136jf-s -mfpu=vfp -mfloat-abi=softfp -D_GNU_SOURCE"
      run: |
        cd /opt/netsurf/${TOOLCHAIN_NAME}
        
        # Build modern binutils 2.42
        wget https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.xz
        tar xf binutils-2.42.tar.xz
        mkdir binutils-build && cd binutils-build
        ../binutils-2.42/configure \
          --target=${TARGET} \
          --prefix=${GCCSDK_INSTALL_ROOT} \
          --disable-nls --disable-werror
        make -j$(nproc) && make install
        cd ..
        
        # Build GCC 13.2.0
        wget https://ftp.gnu.org/gnu/gcc/gcc-13.2.0/gcc-13.2.0.tar.xz
        tar xf gcc-13.2.0.tar.xz
        mkdir gcc-build && cd gcc-build
        ../gcc-13.2.0/configure \
          --target=${TARGET} \
          --prefix=${GCCSDK_INSTALL_ROOT} \
          --enable-languages=c,c++ \
          --disable-nls --disable-libssp --disable-libgomp \
          --disable-libquadmath --disable-libatomic \
          --with-arch=armv6 --with-tune=arm1136jf-s --with-fpu=vfp \
          ${CFLAGS_FOR_TARGET}
        make all-gcc all-target-libgcc -j$(nproc)
        make install-gcc install-target-libgcc
        cd ..
        
        # Build glibc 2.38 (TLS 1.2+ capable)
        wget https://ftp.gnu.org/gnu/glibc/glibc-2.38.tar.xz
        tar xf glibc-2.38.tar.xz
        mkdir glibc-build && cd glibc-build
        ../glibc-2.38/configure \
          --prefix=${GCCSDK_INSTALL_ROOT}/${TARGET} \
          --host=${TARGET} \
          --with-headers=${GCCSDK_INSTALL_ROOT}/${TARGET}/include \
          --enable-kernel=2.6.10 \
          --enable-tls --enable-thread-first --with-tls=gnu2 \
          --disable-profile --without-gd \
          ${CFLAGS_FOR_TARGET}
        make -j$(nproc) && make install
        cd ..

    - name: Build OpenSSL 3.3.0 (TLS 1.2/1.3)
      env:
        TOOLCHAIN_NAME: "arm-none-linux-gnueabi"
        GCCSDK_INSTALL_ROOT: /opt/netsurf/${TOOLCHAIN_NAME}
        TARGET: arm-none-linux-gnueabi
        PATH: ${GCCSDK_INSTALL_ROOT}/bin:${PATH}
        CFLAGS_FOR_TARGET: "-march=armv6 -mtune=arm1136jf-s -mfpu=vfp -mfloat-abi=softfp"
      run: |
        cd /opt/netsurf/${TOOLCHAIN_NAME}
        wget https://www.openssl.org/source/openssl-3.3.0.tar.gz
        tar xzf openssl-3.3.0.tar.gz
        cd openssl-3.3.0
        
        CC=${TARGET}-gcc \
        AR=${TARGET}-ar \
        RANLIB=${TARGET}-ranlib \
        CFLAGS="${CFLAGS_FOR_TARGET}" \
        ./Configure linux-armv6 \
          --prefix=${GCCSDK_INSTALL_ROOT}/${TARGET} \
          --openssldir=${GCCSDK_INSTALL_ROOT}/${TARGET}/ssl \
          no-async no-shared no-legacy no-weak-ssl-ciphers \
          -DOPENSSL_USE_NODELETE
        
        make -j$(nproc) build_libs
        make install_sw install_ssldirs

    - name: Build SDK environment
      env:
        GCCSDK_INSTALL_CROSSBIN: /opt/netsurf/arm-none-linux-gnueabi/cross/bin
        GCCSDK_INSTALL_ENV: /opt/netsurf/arm-none-linux-gnueabi/env
      run: |
        mkdir -p ${GCCSDK_INSTALL_ENV}/bin
        cat > ${GCCSDK_INSTALL_ENV}/bin/setup.sh << 'EOF'
        #!/bin/sh
        export PATH=/opt/netsurf/arm-none-linux-gnueabi/cross/bin:$PATH
        export CC=arm-none-linux-gnueabi-gcc
        export CXX=arm-none-linux-gnueabi-g++
        export LD=arm-none-linux-gnueabi-ld
        export AR=arm-none-linux-gnueabi-ar
        export RANLIB=arm-none-linux-gnueabi-ranlib
        export STRIP=arm-none-linux-gnueabi-strip
        echo "Kindle 3 toolchain environment activated"
        EOF
        chmod +x ${GCCSDK_INSTALL_ENV}/bin/setup.sh
        ln -s ${GCCSDK_INSTALL_ROOT}/bin ${GCCSDK_INSTALL_CROSSBIN}

    - name: Write testament
      run: |
        TOOLCHAIN_NAME="arm-none-linux-gnueabi"
        cat > /opt/netsurf/${TOOLCHAIN_NAME}/BUILD_INFO.txt << EOF
        Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        Branch: ${{ github.ref_name }}
        Commit: $(git rev-parse HEAD)
        Subject: $(git log -1 --pretty=format:'%s')
        Target: Kindle 3 / Kindle Keyboard 3G (Freescale i.MX353 ARM1136 @ 532MHz)
        Architecture: ARMv6 (-march=armv6 -mtune=arm1136jf-s)
        FPU: VFP (-mfpu=vfp -mfloat-abi=softfp)
        Toolchain: GCC 13.2.0, glibc 2.38, OpenSSL 3.3.0
        Features: TLS 1.2/1.3, modern libc, ARMv6 SIMD, VFP acceleration
        Kernel: 2.6.10 compatible
        EOF

    - name: Make Kindle 3 tarball
      run: |
        TOOLCHAIN_NAME="arm-none-linux-gnueabi"
        tar -czf ${TOOLCHAIN_NAME}-kindle3-modern.tar.gz \
               --exclude='*/env/bin/*' \
               --exclude='*/share/doc/*' \
               --exclude='*/share/man/*' \
               --exclude='*.tar.xz' \
               --exclude='*.tar.gz' \
               -C / opt/netsurf

    - name: Upload Kindle 3 toolchain
      uses: actions/upload-artifact@v4
      with:
        name: kindle3-toolchain-modern
        path: arm-none-linux-gnueabi-kindle3-modern.tar.gz
        compression-level: 0

  release:
    name: 'Release Kindle 3 Toolchain'
    needs: toolchain
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Download Kindle 3 artifact
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        pattern: kindle3-toolchain-modern

    - name: Generate release tag
      id: tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "tag_exists=true" >> $GITHUB_OUTPUT
        else
          branch_name="${{ github.ref_name }}"
          safe_branch=$(echo "$branch_name" | sed 's/[^a-zA-Z0-9._-]/-/g')
          new_tag="kindle3-${safe_branch}-unstable"
          if git ls-remote --tags origin | grep -q "refs/tags/$new_tag$"; then
            echo "tag=$new_tag" >> $GITHUB_OUTPUT
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag=$new_tag" >> $GITHUB_OUTPUT
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Get or create release
      id: release
      run: |
        tag="${{ steps.tag.outputs.tag }}"
        
        if [[ "${{ steps.tag.outputs.tag_exists }}" == "true" ]]; then
          echo "Getting existing release for tag $tag"
          release_data=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag")
          release_id=$(echo "$release_data" | jq -r '.id')
          upload_url=$(echo "$release_data" | jq -r '.upload_url')
        else
          echo "Creating new release for tag $tag"
          release_data=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$(jq -n \
              --arg tag "$tag" \
              --arg name "Kindle 3 Modern Toolchain $tag" \
              --arg body "ARM1136 Kindle 3 toolchain: GCC 13.2.0 + glibc 2.38 + OpenSSL 3.3.0 (TLS 1.2/1.3 support for NetSurf)" \
              --argjson prerelease true \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $prerelease}')")
          release_id=$(echo "$release_data" | jq -r '.id')
          upload_url=$(echo "$release_data" | jq -r '.upload_url')
        fi
        
        echo "release_id=$release_id" >> $GITHUB_OUTPUT
        echo "upload_url=$upload_url" >> $GITHUB_OUTPUT

    - name: Upload Kindle 3 toolchain asset
      run: |
        upload_url="${{ steps.release.outputs.upload_url }}"
        upload_url_base="${upload_url%\{*}"
        
        for artifact_dir in artifacts/*/; do
          if [ -d "$artifact_dir" ]; then
            asset_file=$(ls $artifact_dir/*.tar.gz 2>/dev/null | head -1)
            if [ -f "$asset_file" ]; then
              asset_name=$(basename "$asset_file")
              echo "Uploading $asset_name..."
              curl -s -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Content-Type: application/gzip" \
                --data-binary @"$asset_file" \
                "$upload_url_base?name=$asset_name"
            fi
          fi
        done
